name: Pages

# Publishes the landing page in site/ to GitHub Pages. The page imports the real
# <dot-pal> web component from src/ and shows screenshots from docs/, so both are
# copied next to it. Every path in site/ is relative, so it works under /dotpals/.
#
# The site is hosted on Vercel (vercel.json), so this only runs when started by hand
# (Actions → Pages → Run workflow). To publish on every push instead, turn on Pages
# (Settings → Pages → Source: GitHub Actions) and add a `push:` trigger here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Assemble _site
        shell: bash
        run: |
          set -euo pipefail
          node site/build.mjs
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
