name: Pages

# Publishes the landing page in site/ to GitHub Pages. The page imports the real
# <dot-pal> web component from src/ and shows screenshots from docs/, so both are
# copied next to it. Every path in site/ is relative, so it works under /dotpals/.
#
# The site is hosted on Vercel (vercel.json), so this only runs when started by hand
# (Actions → Pages → Run workflow). To publish on every push instead, turn on Pages
# (Settings → Pages → Source: GitHub Actions) and add a `push:` trigger here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble _site
        shell: bash
        run: |
          set -euo pipefail
          node site/build.mjs
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
