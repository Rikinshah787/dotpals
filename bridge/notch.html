    function turnBlock(s, t, live) {
      const box = el('div', `turn ${harnessClass(s.harness)}`);
      if (t.prompt) {
        const asked = el('div', 'asked');
        asked.append(el('small', '', `You asked · ${shortTime(t.at)}`), t.prompt.title.split('\n')[0]);
        asked.title = t.prompt.title;
        box.append(asked);
      }
      // Simple view (shared with the pal): one plain sentence and the warnings that matter.
      const easy = storyView() === 'simple' ? simple(t, { live }) : null;
      if (easy) {
        const line = el('p', `simple ${easy.status}`);
        line.append(el('span', 'mark', { ok: '✓', failed: '✕', unclear: '?', running: '…', stopped: '■' }[easy.status] ?? '•'), el('span', '', easy.text));
        box.append(line);
        if (easy.warnings.length) {
          const f = el('div', 'flags');
          for (const w of easy.warnings) f.append(el('div', 'flag', w));
          box.append(f);
        }
      } else if (t.end?.summary) {
        const said = el('p', 'said');
        said.append(el('b', '', `${harnessName(s.harness)}: `), plain(t.end.summary));
        box.append(said);
      } else if (t.end?.kind === 'error') {
        box.append(el('p', 'said bad', t.end.title));
      }
      const { chapters, flags } = story(t, live ? stepsOf(s) : t.steps);
      if (!easy && chapters.length) {
        const ul = el('ul', 'chapters');
        // Small steps (tool plumbing, scratch files, memory) fold away in the notch.
        const shown = chapters.length > 1 ? chapters.filter((c) => !minorChapter(c)) : chapters;
        for (const c of shown) ul.append(chapterRow(t, c));
        if (shown.length < chapters.length) ul.append(el('li', 'small-steps', `+ ${plural(chapters.length - shown.length, 'small step')}`));
        box.append(ul);
      }
      if (!easy && flags.length) {
        const f = el('div', 'flags');
        for (const x of flags.slice(0, 4)) { const d = el('div', `flag ${x.level}`, x.text); d.title = sentence(x.step); f.append(d); }
        box.append(f);
      }
      const review = reviewBlock(t, { live, waiting: s.state === 'waiting' });
      if (review) box.append(review);
      const foot = el('footer');
      if (t.end) {
        const took = turnTime(t);
        const ok = t.end.kind === 'done';
        foot.append(el('span', ok ? 'ok' : 'bad', ok ? '✓ Done' : '✕ Stopped'), took > 0 ? ` in ${secs(took)}` : '');
      } else foot.append(live ? `Working · ${plural(t.steps.length, 'step')} so far` : t.steps.length ? 'Stopped' : '');
      foot.append(el('span', 'grow'));
      if (t.end || t.steps.length) {
        const copy = button('mini-btn', 'Copy', null, 'Copy this as Markdown (for a PR, commit message or standup)');
        copy.onclick = () => copyText(easy ? [t.prompt ? `### ${t.prompt.title.split(/\n/)[0]}` : '', easy.text, ...easy.warnings.map((w) => `- ⚠ ${w}`)].filter(Boolean).join('\n\n') : turnMarkdown(t, { live }), copy);
        foot.append(copy);
      }
      box.append(foot);
      return box;
    }
    function chapterRow(t, c) {
      const key = `${t.id}:${c.type}`;
      const open = openChapters.has(key);
      const li = el('li', `ch t-${c.type}${c.status === 'failed' ? ' failed' : ''}${c.quiet ? ' quiet' : ''}${open ? ' open' : ''}`);
      const row = el('div', 'row');
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-expanded', String(open));
      const what = el('span', 'what');
      what.append(el('b', '', c.title));
      if (c.detail) what.append(el('small', '', c.detail));
      what.title = [c.title, c.detail].filter(Boolean).join(' · ');
      const side = el('span', 'side');
      if (c.lines?.add || c.lines?.del) side.append(el('span', 'add', `+${c.lines.add}`), el('span', 'del', `−${c.lines.del}`));
      if (c.status === 'running' || c.status === 'waiting') side.append(el('span', 'spin'));
      else if (c.status === 'failed') side.append(el('span', 'bad', '✕'));
      else if (c.status === 'unclear') side.append(Object.assign(el('span', 'unclear', '?'), { title: 'Tests unclear: dotpals couldn’t tell whether they passed' }));
      else if (['test', 'build', 'ship'].includes(c.type)) side.append(el('span', 'ok', '✓'));
      side.append(el('span', 'caret', '▶'));
      row.append(el('span', 'mark'), what, side);
      const toggle = () => { openChapters.has(key) ? openChapters.delete(key) : openChapters.add(key); activity(); render(); };
      row.onclick = toggle;
      row.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } };
      li.append(row);
      if (open) {
        const ul = el('ul', 'steps');
        for (const e of c.steps.slice(-30)) { const x = el('li', e.status === 'failed' ? 'failed' : '', sentence(e)); x.title = sentence(e); ul.append(x); }
        if (c.steps.length > 30) ul.prepend(el('li', 'more', `${plural(c.steps.length - 30, 'earlier step')}`));
        li.append(ul);
      }
      return li;
    }

    // -- the pointer, keys and idle time (from desktop/main.js) --------------------------------
    // The window never takes focus, so hover comes from the cursor position the app
    // sends (relative to this window), and keys from shortcuts it holds only while needed.
    let cursor = null;
    let lastMoveAt = 0;
    function hit(p) {
      const mode = derive(machine, Date.now()).mode;
      const zone = mode === 'hidden' ? STRIP : size;
      // The island hangs from the window's top centre. Measure from the centre of the
      // window the position was taken in: mid-resize, innerWidth may not have caught up.
      const mid = (Number.isFinite(p.width) ? p.width : innerWidth) / 2;
      return p.y >= -2 && p.y <= zone.h + 1 && Math.abs(p.x - mid) <= zone.w / 2 + 1;
    }
    let anchor = null; // where the pointer came to rest over the island
    function onPointer(p) {
      cursor = p;
      const inside = hit(p);
      if (inside) lastMoveAt = Date.now();
      // Moving more than a few px restarts a peek's dwell (see notch-state.js).
      const restless = inside && !!anchor && Math.hypot(p.x - anchor.x, p.y - anchor.y) > 6;
      if (!inside || !anchor || restless) anchor = inside ? p : null;
      send({ type: 'pointer', inside, restless });
      if (inside && shown.v?.mode === 'open') syncKeys(shown.v, shown.kind, shown.tab);
    }
    /** A click, scroll or key over the island counts as activity (keeps it open). */
    function activity() { lastMoveAt = Date.now(); send({ type: 'pointer', inside: true }); }
    if (desktop?.onCursor) {
      desktop.onCursor((p) => {
        if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
        DotPal.pointAt?.(p.x, p.y);
        onPointer(p);
      });
    } else {
      // In a browser tab: the page's own pointer events.
      addEventListener('pointermove', (e) => onPointer({ x: e.clientX, y: e.clientY }), { passive: true });
      document.documentElement.addEventListener('pointerleave', () => onPointer({ x: -9999, y: -9999 }));
    }
    island.addEventListener('pointerdown', () => activity());
    island.addEventListener('wheel', () => activity(), { passive: true });
    addEventListener('keydown', (e) => { if (e.key === 'Escape') send({ type: 'close' }); });
    desktop?.onIdle?.((seconds) => { if (Number.isFinite(seconds)) send({ type: 'idle', seconds }); });

    // Shortcuts: Esc while it's open and you're moving the mouse over it; Ctrl+Alt+Y/N
    // while an approval card is on show. The app registers them only then.
    let keysWant = '';
    let keysGot = { escape: false, allow: false, deny: false };
    let escTimer = 0;
    function syncKeys(v, kind, tab) {
      const now = Date.now();
      const escape = v.mode === 'open' && machine.hover && now - lastMoveAt < 8000;
      const a = kind === 'approval' && tab === 'now' ? pendingAsk(shown.focus?.id) : null;
      const approval = v.mode === 'open' && !!a && !answering.has(a.id);
      clearTimeout(escTimer);
      if (escape) escTimer = setTimeout(() => syncKeys(shown.v, shown.kind, shown.tab), lastMoveAt + 8000 - now + 20);
      const k = `${escape}|${approval}`;
      if (k === keysWant) return;
      keysWant = k;
      if (!desktop?.notchKeys) return;
      Promise.resolve(desktop.notchKeys({ escape, approval })).then((got) => {
        if (keysWant !== k || !got) return;
        const next = { escape: !!got.escape, allow: !!got.allow, deny: !!got.deny };
        const changed = next.allow !== keysGot.allow || next.deny !== keysGot.deny;
        keysGot = next;
        if (changed) render();
      }).catch(() => {});
    }
    desktop?.onNotchKey?.((key) => {
      if (key === 'escape') { send({ type: 'close' }); return; }
      if (key !== 'allow' && key !== 'deny') return;
      const { v, kind, tab, focus } = shown;
      const a = v?.mode === 'open' && kind === 'approval' && tab === 'now' ? pendingAsk(focus?.id) : null;
      if (a) answer(a, key, view.node?.querySelector('.card.tone-need'));
    });

    // -- start ---------------------------------------------------------------------------------
    async function refreshUsage() {
      try { usage = (await desktop?.usage?.())?.agents ?? []; } catch { usage = []; }
      schedule();
    }
    desktop?.connect(onEvent, () => {});
    refreshUsage();
    setInterval(refreshUsage, 20_000);
    setInterval(() => { send({ type: 'agents', running: running() }); schedule(); }, 15_000); // "just finished" agents leave, reset times move on
    setInterval(() => { if (asks.size && shown.v?.mode === 'open') render(); }, 1000); // the approval countdown
    render();
  </script>
</body>
</html>
