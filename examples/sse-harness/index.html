<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dotpals × SSE harness</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: end center; background: #000; color: #eee; font: 16px system-ui, sans-serif; }
    p { position: fixed; top: 16px; left: 16px; margin: 0; color: #999; }
  </style>
  <script type="module">
    import { connectAgent } from '/src/index.js';
    connectAgent(document.querySelector('dot-pal'), new EventSource('/events'));
  </script>
</head>
<body>
  <p>This pal is driven entirely by <code>/events</code> (Server-Sent Events).</p>
  <dot-pal character="grok" size="280"></dot-pal>
</body>
</html>
